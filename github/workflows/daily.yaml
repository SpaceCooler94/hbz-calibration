name: daily

# Grade yesterday, snapshot today. Runs on a schedule once the file exists
# in the repo — nothing to do after setup beyond leaving it there. Order
# matters: yesterday's games are final before today's lineups matter, and
# grading first keeps the aggregates current when the snapshot is built.
# Free on a public repo.

on:
  schedule:
    - cron: "10 15 * * *"      # 11:10 ET / 08:10 PT (UTC), after prior night settles
  workflow_dispatch:

permissions:
  contents: write               # commit agg/snapshots/ledger via GITHUB_TOKEN

env:
  SEASON_START: "2026-03-26"    # one place to edit the season opener

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      # Played days are immutable, so this cache only grows; a cold run
      # just re-fetches and repopulates it.
      - uses: actions/cache@v4
        with:
          path: data/raw
          key: statcast-raw-${{ github.run_id }}
          restore-keys: statcast-raw-

      - name: Grade yesterday's snapshot into the ledger
        run: python3 join_outcomes.py

      - name: Snapshot today's slate before first pitch
        run: python3 collect_daily.py --season-start "$SEASON_START"

      - name: Commit
        run: |
          git config user.name  "hbz-bot"
          git config user.email "hbz-bot@users.noreply.github.com"
          git add agg snapshots ledger.csv 2>/dev/null || true
          git diff --staged --quiet || git commit -m "daily: $(date -u +%F)"
          git push
